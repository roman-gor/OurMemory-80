<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Наша память</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #7f0410;
      --ink: #1f1a1a;
      --muted: #5f5656;
      --paper: #ffffff;
      --paper-high: #f0f0f0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Mulish", sans-serif; color: var(--ink); background: var(--paper); }
    main { max-width: 560px; margin: 0 auto; padding-bottom: 32px; }
    .hero { position: relative; aspect-ratio: 0.85; background: var(--paper-high); }
    .hero img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .hero .scrim { position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.8)); }
    .hero .title { position: absolute; left: 20px; right: 20px; bottom: 20px; color: #fff; }
    .hero h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    .hero p { margin: 4px 0 0; font-size: 16px; opacity: 0.85; }
    section { padding: 0 16px; margin-top: 24px; }
    h2 { color: var(--red); font-size: 20px; margin: 0 0 8px; }
    .plot { color: var(--muted); }
    .message { padding: 48px 16px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <main id="card"><p class="message">Загрузка…</p></main>
  <script>
    const DATABASE_URL = "https://chatroom-85fb8-default-rtdb.firebaseio.com/OurMemory";
    const card = document.getElementById("card");
    const veteranId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function showMessage(text) {
      card.replaceChildren(element("p", "message", text));
    }

    function render(veteran, burial) {
      document.title = `${veteran.name} — Наша память`;
      const hero = element("div", "hero");
      if (veteran.portrait) {
        const portrait = element("img");
        portrait.src = veteran.portrait;
        portrait.alt = veteran.name;
        hero.append(portrait);
      }
      const title = element("div", "title");
      title.append(element("h1", null, veteran.name));
      if (veteran.years) title.append(element("p", null, veteran.years));
      hero.append(element("div", "scrim"), title);
      card.replaceChildren(hero);

      if (veteran.allInfo || veteran.baseInfo) {
        const about = element("section");
        about.append(element("h2", null, "Биография"), element("p", null, veteran.allInfo || veteran.baseInfo));
        card.append(about);
      }
      if (burial && burial.section && burial.row && burial.place) {
        const place = element("section");
        place.append(
          element("h2", null, "Место захоронения"),
          element("p", "plot", `Участок ${burial.section} · ряд ${burial.row} · место ${burial.place}`)
        );
        card.append(place);
      }
    }

    async function load(node) {
      const response = await fetch(`${DATABASE_URL}/${node}.json`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return Object.values((await response.json()) || {});
    }

    Promise.all([load("Veterans"), load("Burials")])
      .then(([veterans, burials]) => {
        const veteran = veterans.find(item => item.id === veteranId);
        if (!veteran) return showMessage("Ветеран не найден");
        render(veteran, burials.find(item => item.id === veteran.burialId));
      })
      .catch(() => showMessage("Не удалось загрузить данные. Проверьте подключение к интернету"));
  </script>
</body>
</html>
